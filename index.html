<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>수암골 바람길</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1E2B32; --ink2:#51616A; --paper:#EEF2F0; --panel:#FFFFFF; --line:#D5DDDA;
  --still:#D9822B; --sand:#E9CF8E; --breeze:#6CC3C8; --deep:#1B6A96;
  --route:#1E2B32; --accent:#1B6A96; --mapfilter:none;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ink:#E6EEEC; --ink2:#9FB0B5; --paper:#121A1E; --panel:#1A252B; --line:#2C3A41;
    --route:#FFFFFF; --accent:#6CC3C8; --mapfilter:invert(.9) hue-rotate(180deg) saturate(.6) brightness(.9);
  }
}
:root[data-theme="dark"]{
  --ink:#E6EEEC; --ink2:#9FB0B5; --paper:#121A1E; --panel:#1A252B; --line:#2C3A41;
  --route:#FFFFFF; --accent:#6CC3C8; --mapfilter:invert(.9) hue-rotate(180deg) saturate(.6) brightness(.9);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;height:100%;background:var(--paper);color:var(--ink);
  font-family:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:15px;line-height:1.55}
.app{display:grid;grid-template-columns:minmax(0,1fr) 360px;height:100%}
.mapwrap{position:relative;overflow:hidden;background:var(--paper);touch-action:none;cursor:crosshair}
svg#map{width:100%;height:100%;display:block}
#map image{filter:var(--mapfilter)}
.panel{background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;padding:22px 22px 28px}
h1{font-family:"Black Han Sans","IBM Plex Sans KR",sans-serif;font-weight:400;font-size:44px;line-height:1;margin:0 0 6px;letter-spacing:-.5px}
.lede{color:var(--ink2);margin:0 0 18px;max-width:34em}
section{border-top:1px solid var(--line);padding:16px 0 4px}
h2{font-size:15px;font-weight:700;margin:0 0 10px}
label.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:14px;margin:10px 0 4px}
label.row output{font-weight:700;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--accent)}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;border:0;background:transparent;color:var(--ink);font:inherit;font-size:14px;padding:8px 4px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--panel);font-weight:700}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.legend{margin-top:12px}
.bar{height:10px;border-radius:5px;background:linear-gradient(90deg,var(--still),var(--sand),var(--breeze),var(--deep))}
.ticks{display:flex;justify-content:space-between;font-size:12px;color:var(--ink2);margin-top:3px;font-variant-numeric:tabular-nums}
.hint{font-size:14px;color:var(--ink2);margin:0 0 10px}
.cmp{display:grid;grid-template-columns:auto 1fr 1fr;gap:6px 12px;font-size:14px;font-variant-numeric:tabular-nums;margin-top:8px}
.cmp .h{font-weight:700}
.cmp .k{color:var(--ink2)}
.verdict{margin:12px 0 0;font-size:14px;padding:10px 12px;border-radius:10px;background:color-mix(in srgb,var(--breeze) 18%,transparent)}
.btn{border:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;font-size:14px;padding:7px 12px;border-radius:10px;cursor:pointer}
details{font-size:14px}
details summary{cursor:pointer;font-weight:700;padding:4px 0}
details p{margin:6px 0 10px;color:var(--ink2)}
.eq{font-family:"IBM Plex Sans KR",serif;color:var(--ink);background:color-mix(in srgb,var(--line) 45%,transparent);padding:6px 10px;border-radius:8px;display:block;margin:6px 0;overflow-x:auto;white-space:nowrap}
.zoom{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:20px;cursor:pointer}
.tip{position:absolute;pointer-events:none;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px;line-height:1.45;max-width:230px;box-shadow:0 4px 14px rgba(0,0,0,.12);display:none;font-variant-numeric:tabular-nums}
.toast{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:8px 14px;border-radius:999px;font-size:14px;display:none;white-space:nowrap}
.sitelist{list-style:none;padding:0;margin:0;font-size:14px}
.sitelist li{display:grid;grid-template-columns:1fr auto auto;gap:10px;padding:5px 0;border-bottom:1px dashed var(--line);font-variant-numeric:tabular-nums}
.sitelist li span:first-child{color:var(--ink)}
.sitelist li span{color:var(--ink2)}
@media (max-width:820px){
  .app{grid-template-columns:1fr;grid-template-rows:62vh auto;height:auto}
  .mapwrap{height:62vh}
  .panel{border-left:0;border-top:1px solid var(--line);overflow:visible}
  h1{font-size:36px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

function hex(c){c=c.trim().replace('#','');return [0,2,4].map(i=>parseInt(c.slice(i,i+2),16));}
function stops(){ const s=getComputedStyle(document.documentElement); return ['--still','--sand','--breeze','--deep'].map(k=>hex(s.getPropertyValue(k))); }
let ST = stops();
function ramp(t){ t=Math.min(1,Math.max(0,t)); const n=ST.length-1, k=Math.min(n-1,Math.floor(t*n)), u=t*n-k;
  const a=ST[k], b=ST[k+1]; return `rgb(${a.map((x,i)=>Math.round(x+(b[i]-x)*u)).join(',')})`; }

let paths=[];

  if(layer==='v') vals=edges.map(wind);
  else if(layer==='q') vals=edges.map(traffic);

  const lo=quant(vals,0), hi=quant(vals,.99);

  edges.forEach((e,i)=>{ const t=(vals[i]-lo)/((hi-lo)||1);

// 줌/이동
let vb=[0,0,MW,MH];
function setVB(){ svg.setAttribute('viewBox',vb.join(' ')); if(typeof redrawPins==='function') redrawPins(); }
function asp(){ const r=svg.getBoundingClientRect(); return (r.height/r.width)||1; }
function clampVB(){ const a=asp(), maxW=Math.max(MW,MH/a);
  vb[2]=Math.min(maxW,Math.max(90,vb[2])); vb[3]=vb[2]*a;
  vb[0]= vb[2]>=MW ? (MW-vb[2])/2 : Math.min(MW-vb[2],Math.max(0,vb[0]));
  vb[1]= vb[3]>=MH ? (MH-vb[3])/2 : Math.min(MH-vb[3],Math.max(0,vb[1])); }
function zoomAt(k,cx,cy){ const nw=vb[2]*k, nh=vb[3]*k; vb=[cx-(cx-vb[0])*k, cy-(cy-vb[1])*k, nw, nh]; clampVB(); setVB(); }
function toSvg(ev){ const pt=svg.createSVGPoint(); pt.x=ev.clientX; pt.y=ev.clientY; return pt.matrixTransform(svg.getScreenCTM().inverse()); }
svg.addEventListener('wheel',ev=>{ ev.preventDefault(); const p=toSvg(ev); zoomAt(ev.deltaY>0?1.15:1/1.15,p.x,p.y); },{passive:false});
$('#zin').onclick=()=>zoomAt(1/1.4,vb[0]+vb[2]/2,vb[1]+vb[3]/2);
$('#zout').onclick=()=>zoomAt(1.4,vb[0]+vb[2]/2,vb[1]+vb[3]/2);
function fitAll(){ vb=[0,0,1e6,0]; clampVB(); setVB(); }
$('#zfit').onclick=fitAll;
addEventListener('resize',()=>{ clampVB(); setVB(); });
let drag=null; const ptrs=new Map(); let pinch=null;
svg.addEventListener('pointerdown',ev=>{ ptrs.set(ev.pointerId,{x:ev.clientX,y:ev.clientY}); svg.setPointerCapture(ev.pointerId);
  if(ptrs.size===2){ const [a,b]=[...ptrs.values()]; pinch={d:Math.hypot(a.x-b.x,a.y-b.y),vb:[...vb]}; drag=null; }
  else drag={x:ev.clientX,y:ev.clientY,vb:[...vb],moved:false}; });
svg.addEventListener('pointermove',ev=>{ if(!ptrs.has(ev.pointerId)) return; ptrs.set(ev.pointerId,{x:ev.clientX,y:ev.clientY});
  if(pinch&&ptrs.size===2){ const [a,b]=[...ptrs.values()]; const d=Math.hypot(a.x-b.x,a.y-b.y);
    const mid=toSvg({clientX:(a.x+b.x)/2,clientY:(a.y+b.y)/2}); vb=[...pinch.vb]; zoomAt(pinch.d/d,mid.x,mid.y); return; }
  if(!drag) return; const r=svg.getBoundingClientRect(); const s=drag.vb[2]/r.width;
  const dx=ev.clientX-drag.x, dy=ev.clientY-drag.y; if(Math.hypot(dx,dy)>5) drag.moved=true;
  if(drag.moved){ hideTip(); vb=[drag.vb[0]-dx*s,drag.vb[1]-dy*s,vb[2],vb[3]]; clampVB(); setVB(); } });
svg.addEventListener('pointerup',ev=>{ ptrs.delete(ev.pointerId);
  if(pinch){ if(ptrs.size<2) pinch=null; drag=null; return; }
  if(drag&&!drag.moved) pick(toSvg(ev)); drag=null; });
svg.addEventListener('dblclick',ev=>{ ev.preventDefault(); const p=toSvg(ev); zoomAt(1/1.6,p.x,p.y); });
svg.addEventListener('pointercancel',ev=>{ptrs.delete(ev.pointerId);drag=null;pinch=null;});

// 길 찾기
function nearestNode(p){ let best=-1,bd=1e9; reach.forEach(n=>{ const d=(nodes[n][0]-p.x)**2+(nodes[n][1]-p.y)**2; if(d<bd){bd=d;best=n;} }); return best; }
function toast(t){ const el=$('#toast'); el.textContent=t; el.style.display='block'; clearTimeout(toast.h); toast.h=setTimeout(()=>el.style.display='none',2600); }
function pin(n,label){ const g=document.createElementNS(NS,'g'); const [x,y]=nodes[n];
  const col = label==='출발' ? '#E0245E' : '#6A3FD1';
  const k=vb[2]/600;   // 확대 정도에 맞춰 크기 유지
  g.innerHTML=`<circle cx="${x}" cy="${y}" r="${11*k}" fill="${col}" stroke="#fff" stroke-width="${3.5*k}"/>
    <circle cx="${x}" cy="${y}" r="${3.5*k}" fill="#fff"/>
    <g transform="translate(${x},${y-22*k})"><rect x="${-24*k}" y="${-11*k}" width="${48*k}" height="${22*k}" rx="${11*k}" fill="${col}"/>
    <text y="${4.5*k}" text-anchor="middle" font-size="${13*k}" font-weight="700" fill="#fff" style="font-family:'IBM Plex Sans KR',sans-serif">${label}</text></g>`;
  g.dataset.n=n; g.dataset.label=label; gPins.appendChild(g); }
function redrawPins(){ const ps=[...gPins.children].map(g=>[+g.dataset.n,g.dataset.label]); gPins.innerHTML=''; ps.forEach(([n,l])=>pin(n,l)); }
function pick(p){
  const n=nearestNode(p); if(n<0) return;
  if(start===null||end!==null){ start=n; end=null; gPins.innerHTML=''; gRoutes.innerHTML=''; $('#result').innerHTML=''; pin(n,'출발'); $('#rhint').textContent='이제 도착지를 누르세요.'; }
  else { end=n; pin(n,'도착'); $('#rhint').textContent='출발지를 다시 누르면 새로 고를 수 있어요.'; route(); }
}
function dijkstra(s,t,cost){
  const N=nodes.length, dist=new Float64Array(N).fill(Infinity), prev=new Int32Array(N).fill(-1), done=new Uint8Array(N);
  dist[s]=0; const heap=[[0,s]];
  const push=x=>{heap.push(x);let i=heap.length-1;while(i>0){const p=(i-1)>>1;if(heap[p][0]<=heap[i][0])break;[heap[p],heap[i]]=[heap[i],heap[p]];i=p;}};
  const pop=()=>{const top=heap[0],last=heap.pop();if(heap.length){heap[0]=last;let i=0;for(;;){let l=2*i+1,r=l+1,m=i;if(l<heap.length&&heap[l][0]<heap[m][0])m=l;if(r<heap.length&&heap[r][0]<heap[m][0])m=r;if(m===i)break;[heap[m],heap[i]]=[heap[i],heap[m]];i=m;}}return top;};
  while(heap.length){ const [d,u]=pop(); if(done[u]) continue; done[u]=1; if(u===t) break;
    for(const i of adj[u]){ const e=edges[i], v=e.a===u?e.b:e.a, nd=d+cost(e); if(nd<dist[v]){dist[v]=nd;prev[v]=i;push([nd,v]);} } }
  if(!isFinite(dist[t])) return null;
  const path=[]; let u=t; while(u!==s){ const i=prev[u]; path.push(i); const e=edges[i]; u=e.a===u?e.b:e.a; } return path.reverse();
}
function stats(path){ let L=0,Lv=0; path.forEach(i=>{const e=edges[i];L+=e.L;Lv+=e.L*wind(e);}); return {L:L*MPP, v:Lv/L}; }
function drawPath(path){
  const vs=edges.map(wind), lo=quant(vs,0), hi=quant(vs,.99);
  path.forEach(i=>{ const e=edges[i];
    const mk=(w,c)=>{const p=document.createElementNS(NS,'polyline');p.setAttribute('points',e.p.map(q=>q.join(',')).join(' '));
      p.setAttribute('fill','none');p.setAttribute('stroke',c);p.setAttribute('stroke-width',w);p.setAttribute('stroke-linecap','round');p.setAttribute('stroke-linejoin','round'); gRoutes.appendChild(p);};
    mk(11,'var(--route)'); mk(6,ramp((wind(e)-lo)/((hi-lo)||1)));
  });
}
function profile(path){
  const W=300,H=96,pad=4; let x=0; const segs=path.map(i=>{const e=edges[i],s={x0:x,x1:x+e.L,v:wind(e)}; x+=e.L; return s;});
  const lo=Math.min(M.b0,...segs.map(s=>s.v))-0.01, hi=Math.max(...segs.map(s=>s.v))+0.01;
  const sx=v=>pad+v/x*(W-2*pad), sy=v=>H-14-(v-lo)/(hi-lo)*(H-26);
  let d=''; segs.forEach((s,k)=>{ d+=(k?'L':'M')+sx(s.x0).toFixed(1)+','+sy(s.v).toFixed(1)+'L'+sx(s.x1).toFixed(1)+','+sy(s.v).toFixed(1); });
  const area=d+`L${sx(x).toFixed(1)},${sy(M.b0)}L${sx(0).toFixed(1)},${sy(M.b0)}Z`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="경로를 따라 풍속" style="display:block;margin-top:12px;overflow:visible">
    <path d="${area}" fill="var(--breeze)" fill-opacity=".3"/><path d="${d}" fill="none" stroke="var(--ink)" stroke-width="1.6"/>
    <line x1="${pad}" x2="${W-pad}" y1="${sy(M.b0)}" y2="${sy(M.b0)}" stroke="var(--ink2)" stroke-dasharray="3 3"/>
    <text x="${pad}" y="10" font-size="10" fill="var(--ink2)">${hi.toFixed(2)} m/s</text>
    <text x="${W-pad}" y="${sy(M.b0)-4}" font-size="10" fill="var(--ink2)" text-anchor="end">차가 없을 때 ${M.b0.toFixed(2)} m/s</text>
    <text x="${pad}" y="${H-1}" font-size="10" fill="var(--ink2)">출발</text><text x="${W-pad}" y="${H-1}" font-size="10" fill="var(--ink2)" text-anchor="end">${Math.round(x*MPP)} m</text></svg>
    <p class="hint" style="margin:4px 0 0">경로를 따라 풍속. 점선 위로 올라간 만큼이 교통풍입니다.</p>`;
}
function route(){
  if(start===null||end===null) return;
  gRoutes.innerHTML='';
  const path=dijkstra(start,end,e=>e.L);
  if(!path){ $('#result').innerHTML=''; toast('두 곳을 잇는 길이 없어요. 다른 지점을 골라 주세요.'); return; }
  drawPath(path);
  let L=0,Q=0,v=0,vmax=0; path.forEach(i=>{const e=edges[i],l=e.L; L+=l; Q+=l*traffic(e); v+=l*wind(e); vmax=Math.max(vmax,wind(e));});
  Q/=L; v/=L; const dv=Math.max(0,v-M.b0), T=+$('#temp').value, rh=+$('#rh').value, at0=AT(T,rh,M.b0), at1=AT(T,rh,v);
  $('#result').innerHTML=`<div class="cmp" style="grid-template-columns:auto 1fr">
    <span class="k">거리</span><span>${Math.round(L*MPP)} m</span>
    <span class="k">평균 교통량</span><span>${Math.round(Q)}대/5분</span>
    <span class="k">평균 풍속</span><span>${v.toFixed(3)} m/s</span>
    <span class="k h">교통풍</span><span class="h">+${dv.toFixed(3)} m/s</span>
    <span class="k">가장 센 구간</span><span>${vmax.toFixed(3)} m/s</span>
    <span class="k">체감온도</span><span>${at0.toFixed(1)} → ${at1.toFixed(1)} °C</span></div>
    <p class="verdict">차가 없을 때보다 평균 풍속이 ${dv.toFixed(3)} m/s 높고, 그만큼 체감온도가 ${(at0-at1).toFixed(2)} °C 낮습니다.</p>${profile(path)}`;
}
$('#clear').onclick=()=>{ start=end=null; gPins.innerHTML=''; gRoutes.innerHTML=''; $('#result').innerHTML=''; $('#rhint').textContent='지도에서 출발지를 누르세요.'; };

// 컨트롤
function outs(){ $('#houro').textContent=$('#hour').value+'시 (교통량 ×'+f().toFixed(2)+')';
  $('#tempo').textContent=$('#temp').value+' °C'; $('#rho').textContent=$('#rh').value+' %'; }
['hour','temp','rh'].forEach(id=>$('#'+id).addEventListener('input',()=>{ outs(); if(id==='hour') recolor(); route(); }));
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{ layer=b.dataset.layer;
  document.querySelectorAll('.seg button').forEach(x=>x.setAttribute('aria-pressed',x===b)); recolor(); });
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{ ST=stops(); recolor(); });


// ───────── 실시간 시각·날씨 (Open-Meteo, 키 없음)
function kstHour(){ return +new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Seoul',hour:'2-digit',hour12:false}).format(new Date())%24; }
async function live(){
  if(!$('#live').checked) return;
  $('#hour').value=kstHour();
  try{
    const u='https://api.open-meteo.com/v1/forecast?latitude=36.64&longitude=127.49&current=temperature_2m,relative_humidity_2m,wind_speed_10m&wind_speed_unit=ms&timezone=Asia%2FSeoul';
    const r=await fetch(u); if(!r.ok) throw new Error('HTTP '+r.status); const c=(await r.json()).current;
    if(!$('#live').checked) return;
    $('#temp').value=Math.min(38,Math.max(20,c.temperature_2m)); $('#rh').value=Math.min(95,Math.max(30,c.relative_humidity_2m));
    const tm=(c.time||'').slice(11,16);
    $('#liveinfo').textContent=`청주 ${c.temperature_2m} °C, 습도 ${c.relative_humidity_2m}%, 배경풍(10 m 높이) ${c.wind_speed_10m} m/s · ${tm} 기준 Open-Meteo. 교통량은 실시간 공개 자료가 없어 시각별 평균 패턴을 씁니다.`;
    if(c.temperature_2m<20||c.temperature_2m>38) $('#liveinfo').textContent+=' 기온이 슬라이더 범위(20~38 °C) 밖이라 가장 가까운 값으로 맞췄습니다.';
  }catch(e){ $('#liveinfo').textContent='실시간 날씨를 불러올 수 없는 환경입니다. 시각은 현재 값으로 맞췄고, 기온과 습도는 직접 조절하세요.'; }
  outs(); recolor(); route();
}
$('#live').addEventListener('change',()=>{ if($('#live').checked) live(); else $('#liveinfo').textContent='직접 조절 중입니다.'; });
['hour','temp','rh'].forEach(id=>$('#'+id).addEventListener('input',()=>{ if($('#live').checked){ $('#live').checked=false; $('#liveinfo').textContent='직접 조절 중입니다. 다시 체크하면 실시간 값으로 돌아갑니다.'; } }));
setInterval(live,10*60*1000);

outs(); drawRoads(); drawSites(); fitAll(); live();
</script>
